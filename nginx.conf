server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets change with each deploy; keep them short-lived.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=300";
    }

    gzip on;
    gzip_types text/css application/javascript;
}
